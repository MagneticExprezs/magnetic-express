<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnétic Express</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; user-select: none; }
        
        #speedometer {
            position: absolute; top: 20px; left: 20px;
            background: #111827; border: 2px solid rgba(0, 188, 212, 0.4);
            padding: 12px 20px; border-radius: 12px; color: white; font-size: 20px; font-weight: bold;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center;
        }

        #power-display {
            position: absolute; top: 20px; left: 160px;
            background: #111827; border: 2px solid rgba(0, 188, 212, 0.4);
            padding: 12px 20px; border-radius: 12px; color: white; font-size: 14px; font-weight: bold;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center;
        }
        #power-val { color: #f97316; display: block; font-size: 16px; margin-top: 2px; }

        .top-btn-group {
            position: absolute; top: 20px; right: 20px; display: flex; gap: 10px;
        }
        .top-btn {
            background: #f97316; border: none; color: white; padding: 12px 18px;
            border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }
        .top-btn:active { background: #c2410c; }

        #ui {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 520px; background: rgba(17, 24, 39, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            padding: 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); backdrop-filter: blur(10px);
        }

        #btnBuzina {
            background: #f97316; border: none; color: white; padding: 18px 22px;
            border-radius: 14px; font-weight: bold; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4); flex: 1;
        }
        #btnBuzina:active { background: #e65100; }

        .throttle-box {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1.4;
        }
        .throttle-label { font-size: 10px; color: #94a3b8; font-weight: bold; text-align: center; letter-spacing: 0.5px; }
        input[type=range] { width: 100%; accent-color: #f97316; cursor: pointer; height: 8px; }

        #btnFreio {
            background: #ef4444; border: none; color: white; padding: 18px 22px;
            border-radius: 14px; font-weight: bold; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); flex: 1; text-align: center;
        }
        #btnFreio:active { background: #dc2626; }
    </style>
</head>
<body>
    <div id="speedometer">0<br><span style="font-size: 11px; color: #94a3b8;">km/h</span></div>
    <div id="power-display">POTÊNCIA:<span id="power-val">0%</span></div>

    <div class="top-btn-group">
        <button class="top-btn" id="btnCamera">Câmera</button>
        <button class="top-btn" id="btnPortas">Portas</button>
    </div>

    <div id="ui">
        <button id="btnBuzina">BUZINA</button>
        <div class="throttle-box">
            <span class="throttle-label">ACELERADOR / POTÊNCIA</span>
            <input type="range" id="throttle" min="0" max="100" value="0">
        </div>
        <button id="btnFreio">FREIO / STOP</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Configuração dos Áudios na raiz do repositório
        const somBuzina = new Audio('buzina.mp3');
        const somAndando = new Audio('andando.mp3');
        const somAceleracao = new Audio('aceleração.mp3');
        const somParado = new Audio('parado.mp3');
        const somFreiando = new Audio('freiando.mp3');

        somAndando.loop = true;
        somParado.loop = true;

        // Cena, Câmera e Renderizador
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Céu azul
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // Plano Verde (Chão)
        const planeGeo = new THREE.PlaneGeometry(3000, 3000);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x48bb78, roughness: 0.8 });
        const ground = new THREE.Mesh(planeGeo, planeMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.5;
        scene.add(ground);

        // Trilho Reto Infinito
        const trackLength = 1200;
        const trackGeo = new THREE.BoxGeometry(2.5, 0.3, trackLength);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.8, roughness: 0.2 });
        const trackMesh = new THREE.Mesh(trackGeo, trackMat);
        trackMesh.position.y = -1.3;
        scene.add(trackMesh);

        // === TREM ARTICULADO DETALHADO (COM SANFONAS) ===
        const trainGroup = new THREE.Group();

        // Locomotiva principal (Amarela com cabine preta)
        const locoGeo = new THREE.BoxGeometry(2.2, 2.2, 4.5);
        const locoMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.5, roughness: 0.3 });
        const locomotive = new THREE.Mesh(locoGeo, locoMat);
        trainGroup.add(locomotive);

        const cabinGeo = new THREE.BoxGeometry(2.1, 1.0, 1.2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
        const cabinWindow = new THREE.Mesh(cabinGeo, cabinMat);
        cabinWindow.position.set(0, 0.2, 1.7);
        trainGroup.add(cabinWindow);

        scene.add(trainGroup);

        // Vagões Articulados em cadeia com conexões (sanfonas)
        const wagons = [];
        const numWagons = 4;
        for (let i = 0; i < numWagons; i++) {
            const wagonGroup = new THREE.Group();
            
            const wagonGeo = new THREE.BoxGeometry(2.1, 2.1, 4.0);
            const wagonMat = new THREE.MeshStandardMaterial({ color: 0xf3f4f6, metalness: 0.5, roughness: 0.3 });
            const wagonMesh = new THREE.Mesh(wagonGeo, wagonMat);
            wagonGroup.add(wagonMesh);

            const jointGeo = new THREE.BoxGeometry(1.8, 1.8, 0.6);
            const jointMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.9 });
            const jointMesh = new THREE.Mesh(jointGeo, jointMat);
            jointMesh.position.set(0, 0, 2.2);
            wagonGroup.add(jointMesh);

            scene.add(wagonGroup);
            wagons.push(wagonGroup);
        }

        // Estados do Simulador
        let trainZ = 0;
        let speed = 0;
        let targetSpeed = 0;
        let doorsOpen = false;
        let cameraMode = 0;

        const throttleSlider = document.getElementById('throttle');
        const speedometer = document.getElementById('speedometer');
        const powerVal = document.getElementById('power-val');

        throttleSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            targetSpeed = (val / 100) * 1.5;
            powerVal.textContent = val + "%";
            
            [somBuzina, somAndando, somAceleracao, somParado, somFreiando].forEach(s => {
                if (s.paused) { s.play().catch(()=>{}); s.pause(); }
            });
        });

        document.getElementById('btnFreio').addEventListener('click', () => {
            targetSpeed = 0;
            throttleSlider.value = 0;
            powerVal.textContent = "0%";
        });

        document.getElementById('btnBuzina').addEventListener('click', () => {
            somBuzina.currentTime = 0;
            somBuzina.play().catch(()=>{});
        });

        const btnPortas = document.getElementById('btnPortas');
        btnPortas.addEventListener('click', () => {
            if (speed > 0.1) {
                alert("Pare o trem totalmente para abrir as portas!");
                return;
            }
            doorsOpen = !doorsOpen;
            btnPortas.style.background = doorsOpen ? "#ef4444" : "#f97316";
            btnPortas.textContent = doorsOpen ? "Fechar" : "Portas";
        });

        document.getElementById('btnCamera').addEventListener('click', () => {
            cameraMode = (cameraMode + 1) % 3;
        });

        let prevSpeed = 0;
        function updateAudioStates(currentSpeed) {
            const accelDelta = currentSpeed - prevSpeed;

            if (currentSpeed < 0.05) {
                if (somParado.paused) somParado.play().catch(()=>{});
                somAndando.pause();
                somAceleracao.pause();
                somFreiando.pause();
            } else {
                somParado.pause();
                
                if (accelDelta > 0.02) {
                    if (somAceleracao.paused) {
                        somAceleracao.currentTime = 0;
                        somAceleracao.play().catch(()=>{});
                    }
                    somFreiando.pause();
                } else if (accelDelta < -0.02) {
                    if (somFreiando.paused) {
                        somFreiando.currentTime = 0;
                        somFreiando.play().catch(()=>{});
                    }
                    somAceleracao.pause();
                }

                if (somAndando.paused) somAndando.play().catch(()=>{});
            }
            prevSpeed = currentSpeed;
        }

        // Loop de Animação
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            speed += (targetSpeed - speed) * 0.04;
            trainZ -= speed;

            const halfTrack = trackLength / 2;
            if (trainZ < -halfTrack) trainZ = halfTrack;
            if (trainZ > halfTrack) trainZ = -halfTrack;

            const kmh = Math.round(speed * 120);
            speedometer.innerHTML = kmh + '<br><span style="font-size: 11px; color: #94a3b8;">km/h</span>';

            updateAudioStates(speed);

            // Posicionar Locomotiva
            trainGroup.position.set(0, 0, trainZ);

            // Posicionar vagões articulados em sequência
            wagons.forEach((wagon, index) => {
                const spacing = 4.4;
                let wagonZ = trainZ + (index + 1) * spacing;
                if (wagonZ > halfTrack) wagonZ -= trackLength;
                wagon.position.set(0, 0, wagonZ);
            });

            // Câmeras dinâmicas
            if (cameraMode === 0) {
                // Traseira
                camera.position.set(0, 4, trainZ + 15);
                camera.lookAt(0, 0, trainZ);
            } else if (cameraMode === 1) {
                // Cabine
                camera.position.set(0, 1.2, trainZ - 1);
                camera.lookAt(0, 1.2, trainZ - 20);
            } else {
                // Orbital lateral
                const time = clock.getElapsedTime() * 0.5;
                camera.position.set(Math.cos(time) * 15, 6, trainZ + Math.sin(time) * 15);
                camera.lookAt(0, 0, trainZ);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
