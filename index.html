<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnétic Express</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; font-family: sans-serif; user-select: none; }
        #ui {
            position: absolute; bottom: 25px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none;
        }
        .controls-row { display: flex; gap: 12px; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
        button, input[type=range] {
            padding: 12px 20px; font-size: 15px; background: #00bcd4; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active { background: #0097a7; }
        input[type=range] { width: 240px; accent-color: #00bcd4; padding: 0; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="controls-row">
            <input type="range" id="throttle" min="0" max="100" value="0">
        </div>
        <div class="controls-row">
            <button id="btnBuzina">BUZINA</button>
            <button id="btnPortas">PORTAS: FECHADAS</button>
            <button id="btnCamera">CÂMERA</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Configuração oficial dos áudios limpos
        const somBuzina = new Audio('buzina.mp3');
        const somAndando = new Audio('andando.mp3');
        const somAceleracao = new Audio('aceleracao.mp3');
        const somParado = new Audio('parado.mp3');
        const somFreiando = new Audio('freiando.mp3');

        somAndando.loop = true;
        somParado.loop = true;

        // Cena, Câmera e Renderizador
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Pista / Trilhos Magnéticos
        class TrackCurve extends THREE.Curve {
            constructor() { super(); }
            getPoint(t, optionalTarget = new THREE.Vector3()) {
                const tx = Math.sin(t * Math.PI * 2) * 50;
                const ty = Math.sin(t * Math.PI * 4) * 3;
                const tz = Math.cos(t * Math.PI * 2) * 50;
                return optionalTarget.set(tx, ty, tz);
            }
        }
        const path = new TrackCurve();
        const tubeGeometry = new THREE.TubeGeometry(path, 250, 1.2, 8, true);
        const trackMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.2 });
        const trackMesh = new THREE.Mesh(tubeGeometry, trackMaterial);
        scene.add(trackMesh);

        // Construção do Trem Articulado
        const trainGroup = new THREE.Group();
        
        const locoGeo = new THREE.BoxGeometry(2.1, 2.1, 4.2);
        const locoMat = new THREE.MeshStandardMaterial({ color: 0xff3300, metalness: 0.6, roughness: 0.3 });
        const locomotive = new THREE.Mesh(locoGeo, locoMat);
        trainGroup.add(locomotive);

        const wagons = [];
        for (let i = 0; i < 3; i++) {
            const wagonGeo = new THREE.BoxGeometry(2.0, 2.0, 3.8);
            const wagonMat = new THREE.MeshStandardMaterial({ color: 0x00aaff, metalness: 0.6, roughness: 0.3 });
            const wagon = new THREE.Mesh(wagonGeo, wagonMat);
            trainGroup.add(wagon);
            wagons.push(wagon);
        }
        scene.add(trainGroup);

        // Estados do Simulador
        let trainProgress = 0;
        let speed = 0;
        let targetSpeed = 0;
        let doorsOpen = false;
        let cameraMode = 0; // 0: Órbita, 1: Cabine, 2: Seguimento

        const throttleSlider = document.getElementById('throttle');
        throttleSlider.addEventListener('input', (e) => {
            targetSpeed = (e.target.value / 100) * 0.0018;
            
            // Desbloqueio seguro de áudio para dispositivos móveis
            [somBuzina, somAndando, somAceleracao, somParado, somFreiando].forEach(s => {
                if (s.paused) { s.play().catch(()=>{}); s.pause(); }
            });
        });

        document.getElementById('btnBuzina').addEventListener('click', () => {
            somBuzina.currentTime = 0;
            somBuzina.play().catch(()=>{});
        });

        const btnPortas = document.getElementById('btnPortas');
        btnPortas.addEventListener('click', () => {
            if (speed > 0.0001) {
                alert("Pare o trem totalmente para abrir as portas!");
                return;
            }
            doorsOpen = !doorsOpen;
            btnPortas.textContent = doorsOpen ? "PORTAS: ABERTAS" : "PORTAS: FECHADAS";
            btnPortas.style.background = doorsOpen ? "#ff9800" : "#00bcd4";
        });

        document.getElementById('btnCamera').addEventListener('click', () => {
            cameraMode = (cameraMode + 1) % 3;
        });

        // Gerenciamento inteligente dos sons de movimento
        function updateAudioStates(currentSpeed) {
            if (currentSpeed < 0.0001) {
                if (somParado.paused) somParado.play().catch(()=>{});
                somAndando.pause();
                somFreiando.pause();
            } else {
                somParado.pause();
                if (somAndando.paused) somAndando.play().catch(()=>{});
            }
        }

        // Loop de Animação
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            speed += (targetSpeed - speed) * 0.04;
            trainProgress = (trainProgress + speed) % 1;

            updateAudioStates(speed);

            const point = path.getPoint(trainProgress);
            const tangent = path.getTangent(trainProgress);

            trainGroup.position.copy(point);
            trainGroup.lookAt(point.clone().add(tangent));
            trainGroup.position.y += 1.2;

            wagons.forEach((wagon, index) => {
                const lag = (index + 1) * 0.018;
                const pWagon = path.getPoint((trainProgress - lag + 1) % 1);
                wagon.position.copy(pWagon);
                wagon.position.y += 1.2;
                wagon.lookAt(point);
            });

            // Controle de Câmera Dinâmica
            if (cameraMode === 0) {
                const time = clock.getElapsedTime() * 0.15;
                camera.position.x = Math.cos(time) * 75;
                camera.position.z = Math.sin(time) * 75;
                camera.position.y = 35;
                camera.lookAt(0, 0, 0);
            } else if (cameraMode === 1) {
                const cabPos = point.clone().add(new THREE.Vector3(0, 1.8, 0));
                camera.position.copy(cabPos);
                const lookTarget = cabPos.clone().add(tangent.clone().multiplyScalar(10));
                camera.lookAt(lookTarget);
            } else {
                const followPos = point.clone().sub(tangent.clone().multiplyScalar(18)).add(new THREE.Vector3(0, 8, 0));
                camera.position.copy(followPos);
                camera.lookAt(point);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
