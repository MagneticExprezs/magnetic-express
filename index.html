<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnétic Express - Linha 1 (Laranja)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1e293b; font-family: sans-serif; user-select: none; }
        
        #top-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 520px; background: rgba(17, 24, 39, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
            padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); color: white; backdrop-filter: blur(10px);
        }
        .header-title { font-size: 13px; font-weight: bold; color: #f97316; letter-spacing: 0.5px; }
        .header-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
        .header-speed { font-size: 22px; font-weight: bold; color: #facc15; text-align: right; }

        #ui {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 520px; background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            padding: 16px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(10px);
        }

        .btn-row { display: flex; gap: 10px; width: 100%; }
        
        #btnPortas { background: #ef4444; border: none; color: white; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; flex: 1; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
        #btnBuzina { background: #0284c7; border: none; color: white; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; flex: 1; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4); }
        #btnCamera { background: #4b5563; border: none; color: white; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; flex: 1; box-shadow: 0 4px 12px rgba(75, 85, 99, 0.4); }

        .throttle-box {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px;
        }
        .throttle-header { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; font-weight: bold; }
        input[type=range] { width: 100%; accent-color: #ffffff; cursor: pointer; height: 8px; }

        #btnStop {
            background: #f97316; border: none; color: white; padding: 16px;
            border-radius: 14px; font-weight: bold; font-size: 16px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4); text-align: center; letter-spacing: 1px;
        }
        #btnStop:active { background: #c2410c; }
    </style>
</head>
<body>
    <div id="top-panel">
        <div>
            <div class="header-title">MAGNÉTIC EXPRESS - LINHA 1 (LARANJA)</div>
            <div class="header-sub" id="statusText">PARADO NO TÚNEL</div>
        </div>
        <div class="header-speed" id="speedometer">0 km/h</div>
    </div>

    <div id="ui">
        <div class="btn-row">
            <button id="btnPortas">PORTAS</button>
            <button id="btnBuzina">BUZINA</button>
            <button id="btnCamera">CÂMERA</button>
        </div>
        <div class="throttle-box">
            <div class="throttle-header">
                <span>ALAVANCA DE POTÊNCIA</span>
                <span id="power-val">0%</span>
            </div>
            <input type="range" id="throttle" min="0" max="100" value="0">
        </div>
        <button id="btnStop">STOP</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Áudios do Repositório
        const somBuzina = new Audio('buzina.mp3');
        const somAndando = new Audio('andando.mp3');
        const somAceleracao = new Audio('aceleracao.mp3');
        const somParado = new Audio('parado.mp3');
        const somFreiando = new Audio('freiando.mp3');

        somAndando.loop = true;
        somParado.loop = true;

        // Cena, Câmera e Renderizador
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e293b);
        scene.fog = new THREE.FogExp2(0x1e293b, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Iluminação do Túnel
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Curva do Túnel e Trilho
        class TunnelCurve extends THREE.Curve {
            constructor(scale = 1) { super(); this.scale = scale; }
            getPoint(t) {
                const tx = Math.sin(t * Math.PI * 2) * 80;
                const ty = 0;
                const tz = Math.cos(t * Math.PI * 2) * 80;
                return new THREE.Vector3(tx, ty, tz);
            }
        }

        const path = new TunnelCurve();
        
        // Túnel Geometria
        const tubeGeo = new THREE.TubeGeometry(path, 100, 6, 20, true);
        const tubeMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9, side: THREE.BackSide });
        const tunnel = new THREE.Mesh(tubeGeo, tubeMat);
        scene.add(tunnel);

        // Luzes no teto do túnel
        for (let i = 0; i < 20; i++) {
            const lightGeo = new THREE.BoxGeometry(1.5, 0.2, 0.8);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
            const lightMesh = new THREE.Mesh(lightGeo, lightMat);
            const pt = path.getPoint(i / 20);
            lightMesh.position.set(pt.x, pt.y + 5.8, pt.z);
            scene.add(lightMesh);
        }

        // Criar o Comboio Articulado Real (Laranja e Branco com Faixa Preta)
        const trainGroup = new THREE.Group();

        // Função para criar um vagão detalhado idêntico aos prints
        function createTrainCar(isLocomotive = false) {
            const car = new THREE.Group();
            
            // Corpo principal branco/cinza claro
            const bodyGeo = new THREE.BoxGeometry(2.2, 2.2, 5.0);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            car.add(body);

            // Frente Laranja (se for a locomotiva)
            if (isLocomotive) {
                const noseGeo = new THREE.BoxGeometry(2.2, 2.2, 1.5);
                const noseMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.3 });
                const nose = new THREE.Mesh(noseGeo, noseMat);
                nose.position.set(0, 0, 2.0);
                car.add(nose);

                // Vidro frontal escuro da cabine
                const glassGeo = new THREE.BoxGeometry(2.0, 0.9, 0.2);
                const glassMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 });
                const glass = new THREE.Mesh(glassGeo, glassMat);
                glass.position.set(0, 0.3, 2.76);
                car.add(glass);

                // Faróis
                const lightGeo = new THREE.BoxGeometry(0.3, 0.2, 0.1);
                const lightMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
                const l1 = new THREE.Mesh(lightGeo, lightMat); l1.position.set(-0.7, -0.4, 2.8);
                const l2 = new THREE.Mesh(lightGeo, lightMat); l2.position.set(0.7, -0.4, 2.8);
                car.add(l1); car.add(l2);
            }

            // Faixa lateral preta com portas e janelas (característica dos prints)
            const stripeGeo = new THREE.BoxGeometry(2.24, 1.1, 4.8);
            const stripeMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
            const stripe = new THREE.Mesh(stripeGeo, stripeMat);
            car.add(stripe);

            return car;
        }

        // Montar a composição (Locomotiva + Vagões)
        const cars = [];
        const numCars = 5;
        for (let i = 0; i < numCars; i++) {
            const car = createTrainCar(i === 0);
            scene.add(car);
            cars.push(car);
        }

        // Controlo do Simulador
        let trainProgress = 0;
        let speed = 0;
        let targetSpeed = 0;
        let doorsOpen = false;
        let cameraMode = 0;

        const throttleSlider = document.getElementById('throttle');
        const speedometer = document.getElementById('speedometer');
        const powerVal = document.getElementById('power-val');
        const statusText = document.getElementById('statusText');

        throttleSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            targetSpeed = (val / 100) * 0.0015;
            powerVal.textContent = val + "%";
            statusText.textContent = val > 0 ? "EM MOVIMENTO" : "PARADO NO TÚNEL";
            
            [somBuzina, somAndando, somAceleracao, somParado, somFreiando].forEach(s => {
                if (s.paused) { s.play().catch(()=>{}); s.pause(); }
            });
        });

        document.getElementById('btnStop').addEventListener('click', () => {
            targetSpeed = 0;
            throttleSlider.value = 0;
            powerVal.textContent = "0%";
            statusText.textContent = "PARADO NO TÚNEL";
        });

        document.getElementById('btnBuzina').addEventListener('click', () => {
            somBuzina.currentTime = 0;
            somBuzina.play().catch(()=>{});
        });

        const btnPortas = document.getElementById('btnPortas');
        btnPortas.addEventListener('click', () => {
            if (speed > 0.0002) {
                alert("Pare o trem totalmente para abrir as portas!");
                return;
            }
            doorsOpen = !doorsOpen;
            btnPortas.style.background = doorsOpen ? "#16a34a" : "#ef4444";
            statusText.textContent = doorsOpen ? "PORTAS ABERTAS" : "PARADO NO TÚNEL";
        });

        document.getElementById('btnCamera').addEventListener('click', () => {
            cameraMode = (cameraMode + 1) % 3;
        });

        let prevSpeed = 0;
        function updateAudioStates(currentSpeed) {
            const accelDelta = currentSpeed - prevSpeed;
            if (currentSpeed < 0.0001) {
                if (somParado.paused) somParado.play().catch(()=>{});
                somAndando.pause(); somAceleracao.pause(); somFreiando.pause();
            } else {
                somParado.pause();
                if (accelDelta > 0.00002) {
                    if (somAceleracao.paused) { somAceleracao.currentTime = 0; somAceleracao.play().catch(()=>{}); }
                    somFreiando.pause();
                } else if (accelDelta < -0.00002) {
                    if (somFreiando.paused) { somFreiando.currentTime = 0; somFreiando.play().catch(()=>{}); }
                    somAceleracao.pause();
                }
                if (somAndando.paused) somAndando.play().catch(()=>{});
            }
            prevSpeed = currentSpeed;
        }

        // Loop de Animação ao longo da Curva
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            speed += (targetSpeed - speed) * 0.04;
            trainProgress = (trainProgress + speed) % 1;

            const kmh = Math.round((speed / 0.0015) * 160);
            speedometer.textContent = kmh + " km/h";

            updateAudioStates(speed);

            // Posicionar cada vagão na curva do trilho
            cars.forEach((car, index) => {
                const offset = index * 0.012;
                const pPos = (trainProgress - offset + 1) % 1;
                const point = path.getPoint(pPos);
                const tangente = path.getTangent(pPos);

                car.position.copy(point);
                car.lookAt(point.clone().add(tangente));
            });

            // Câmeras dinâmicas
            const locoPoint = path.getPoint(trainProgress);
            const locoTangent = path.getTangent(trainProgress);

            if (cameraMode === 0) {
                // Traseira externa
                const camPos = locoPoint.clone().sub(locoTangent.clone().multiplyScalar(12)).add(new THREE.Vector3(0, 4, 0));
                camera.position.copy(camPos);
                camera.lookAt(locoPoint);
            } else if (cameraMode === 1) {
                // Visão da Cabine / Frente
                const cabPos = locoPoint.clone().add(locoTangent.clone().multiplyScalar(1.5)).add(new THREE.Vector3(0, 1.2, 0));
                camera.position.copy(cabPos);
                const lookTarget = cabPos.clone().add(locoTangent.clone().multiplyScalar(20));
                camera.lookAt(lookTarget);
            } else {
                // Orbital panorâmica
                const time = clock.getElapsedTime() * 0.4;
                camera.position.set(locoPoint.x + Math.cos(time) * 20, locoPoint.y + 10, locoPoint.z + Math.sin(time) * 20);
                camera.lookAt(locoPoint);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
